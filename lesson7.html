<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企會財會計互動工作台｜第 7 課：會計假設、原則及慣例</title>
  <style>
    :root {
      --bg: #06141b;
      --panel: #11212d;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --emerald: #059669;
      --emerald-light: #d1fae5;
      --teal: #0d9488;
      --blue: #2563eb;
      --blue-light: #dbeafe;
      --amber: #d97706;
      --amber-light: #fef3c7;
      --purple: #7c3aed;
      --purple-light: #ede9fe;
      --rose: #e11d48;
      --rose-light: #ffe4e6;
      --scale: 1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif; user-select: none; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(rgba(16, 185, 129, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text);
      padding: 12px;
      font-size: calc(16px * var(--scale));
      line-height: 1.55;
    }
    .app { max-width: 1080px; margin: 0 auto; }

    @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .pop { animation: popIn 0.22s ease-out; }
    .shake { animation: shake 0.3s ease-in-out; }

    /* 頂部狀態列 */
    .top-bar {
      background: linear-gradient(135deg, #064e3b 0%, #0f766e 50%, #1e3a8a 100%);
      border-radius: 16px;
      padding: 14px 22px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .brand-title { font-size: calc(20px * var(--scale)); font-weight: 900; display: flex; align-items: center; gap: 10px; }
    .stat-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill-stat { background: rgba(6, 20, 27, 0.65); border: 1px solid rgba(52, 211, 153, 0.4); padding: 6px 13px; border-radius: 30px; font-weight: 800; font-size: calc(13.5px * var(--scale)); color: #a7f3d0; }
    .ctrl-btn { background: #fbbf24; color: #0f172a; border: none; padding: 7px 14px; border-radius: 30px; font-weight: 900; font-size: calc(13px * var(--scale)); cursor: pointer; transition: transform 0.15s; }
    .ctrl-btn:hover { transform: scale(1.05); background: #fcd34d; }

    /* 五大互動模式導航 */
    .mode-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
    @media (max-width: 820px) { .mode-nav { grid-template-columns: repeat(2, 1fr); } }
    .mode-tab {
      background: var(--panel);
      border: 2px solid #1e3a4c;
      border-radius: 14px;
      padding: 12px 8px;
      color: #94a3b8;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .mode-tab:hover { border-color: #34d399; color: #fff; transform: translateY(-2px); }
    .mode-tab.active {
      background: linear-gradient(135deg, #059669, #0d9488);
      border-color: #6ee7b7;
      color: #fff;
      box-shadow: 0 6px 18px rgba(5, 150, 105, 0.45);
    }
    .mode-icon { font-size: calc(24px * var(--scale)); display: block; margin-bottom: 4px; }
    .mode-label { font-size: calc(14px * var(--scale)); font-weight: 900; display: block; }
    .mode-sub { font-size: calc(11.5px * var(--scale)); opacity: 0.9; }

    /* 主舞台 */
    .stage {
      background-color: var(--card);
      background-image: linear-gradient(to right, rgba(226, 232, 240, 0.35) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(226, 232, 240, 0.35) 1px, transparent 1px);
      background-size: 28px 28px;
      border-radius: 20px;
      padding: 24px;
      min-height: 540px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid #cbd5e1;
    }

    .level-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid #e2e8f0; background: rgba(255,255,255,0.92); border-radius: 10px; padding: 10px 14px; }
    .level-title { font-size: calc(18px * var(--scale)); font-weight: 900; color: #065f46; }
    .dots-nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .dot-btn {
      width: calc(36px * var(--scale)); height: calc(36px * var(--scale));
      border-radius: 10px; border: 2px solid #cbd5e1; background: #fff;
      font-weight: 900; font-size: calc(14px * var(--scale)); cursor: pointer; color: var(--muted);
    }
    .dot-btn.active { background: var(--emerald); color: #fff; border-color: var(--emerald); }
    .dot-btn.done { background: var(--emerald-light); color: #065f46; border-color: var(--emerald); }

    /* ================= 模組 1：會計原則「合規裁判官」診斷台（無提示按鈕） ================= */
    .pillars-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
    @media (max-width: 780px) { .pillars-strip { grid-template-columns: repeat(2, 1fr); } }
    .pillar-chip {
      padding: 13px 8px; border-radius: 10px; border: 2px solid #cbd5e1; background: #f8fafc;
      text-align: center; cursor: pointer; font-weight: 900; font-size: calc(14.5px * var(--scale)); transition: all 0.15s;
    }
    .pillar-chip:hover { border-color: var(--teal); background: #f0fdfa; transform: translateY(-2px); }
    .pillar-chip.picked { border-color: var(--emerald); background: #d1fae5; color: #064e3b; box-shadow: 0 0 0 3px rgba(5,150,105,0.25); }

    .dispute-box {
      background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff;
      border-radius: 16px; padding: 20px 24px; margin-bottom: 16px;
      border-left: 8px solid #fbbf24; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .dispute-speaker { font-size: calc(13px * var(--scale)); color: #fbbf24; font-weight: 900; margin-bottom: 6px; display: block; }
    .dispute-speech { font-size: calc(18px * var(--scale)); font-weight: 900; line-height: 1.5; }

    .step-label { font-size: calc(14.5px * var(--scale)); font-weight: 900; color: #065f46; margin-bottom: 8px; }
    .ruling-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .ruling-btn {
      padding: 13px 16px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff;
      font-size: calc(15px * var(--scale)); font-weight: 800; text-align: left; cursor: pointer; transition: all 0.15s; line-height: 1.5;
    }
    .ruling-btn:hover { border-color: var(--blue); background: #eff6ff; }
    .ruling-btn.picked { border-color: var(--emerald); background: #d1fae5; color: #064e3b; box-shadow: 0 0 0 3px rgba(5,150,105,0.25); }

    /* ================= 模組 2 ＆ 3：三步純數值與對稱計算機 ================= */
    .invoice-card {
      background: #fffbeb; border: 2px solid #f59e0b; border-radius: 14px; padding: 16px 20px;
      margin-bottom: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }
    .inv-title { font-size: calc(16.5px * var(--scale)); font-weight: 900; color: #92400e; margin-bottom: 8px; border-bottom: 2px dashed #fcd34d; padding-bottom: 6px; }
    .inv-body { font-size: calc(14.5px * var(--scale)); font-weight: 800; color: #451a03; line-height: 1.65; }
    .calc-steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
    @media (max-width: 780px) { .calc-steps-grid { grid-template-columns: 1fr; } }
    .calc-step-box { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px; }
    .calc-step-q { font-size: calc(13.5px * var(--scale)); font-weight: 900; color: var(--blue); margin-bottom: 8px; min-height: 42px; }
    .calc-opt-btn {
      display: block; width: 100%; text-align: center; padding: 10px; margin-bottom: 6px;
      border-radius: 8px; border: 2px solid #cbd5e1; background: #fff; font-weight: 900; font-size: calc(14px * var(--scale)); cursor: pointer; transition: all 0.15s;
    }
    .calc-opt-btn:hover { border-color: var(--blue); background: #eff6ff; }
    .calc-opt-btn.picked { background: #dbeafe; border-color: var(--blue); color: #1e3a8a; }

    /* ================= 模組 4：磁力積木砌答案（課本第 85 頁三步答題錦囊） ================= */
    .question-strip { background: #fffbeb; border-left: 6px solid var(--amber); padding: 14px 18px; border-radius: 12px; font-size: calc(16px * var(--scale)); font-weight: 900; color: #78350f; margin-bottom: 14px; }
    .tray-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
    .tray-box { background: #f1f5f9; border: 3px dashed #64748b; border-radius: 16px; padding: 14px 16px; min-height: 84px; margin-bottom: 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .tray-placeholder { color: var(--muted); font-weight: 800; font-size: calc(14.5px * var(--scale)); }
    .slot-chip { padding: 9px 14px; border-radius: 10px; font-weight: 900; font-size: calc(14.5px * var(--scale)); color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
    .chip-step0 { background: var(--blue); }
    .chip-step1 { background: var(--amber); }
    .chip-step2 { background: var(--emerald); }
    .blocks-section-title { font-size: calc(14px * var(--scale)); font-weight: 900; color: #065f46; margin-bottom: 6px; }
    .blocks-pool { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    @media (max-width: 720px) { .blocks-pool { grid-template-columns: 1fr; } }
    .mag-block { padding: 12px 14px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff; font-size: calc(14px * var(--scale)); font-weight: 800; color: var(--text); cursor: pointer; text-align: left; transition: all 0.15s; line-height: 1.5; }
    .mag-block:hover { border-color: var(--emerald); background: #ecfdf5; transform: translateY(-2px); }
    .mag-block.selected { background: #d1fae5; border-color: var(--emerald); box-shadow: inset 0 0 0 2px var(--emerald); }
    .block-tag { display: inline-block; font-size: calc(11.5px * var(--scale)); font-weight: 900; padding: 2px 8px; border-radius: 6px; margin-bottom: 4px; }
    .helper-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--emerald); background: #ecfdf5; color: #065f46; font-weight: 800; font-size: calc(13px * var(--scale)); cursor: pointer; }
    .helper-btn:hover { background: var(--emerald); color: #fff; }

    /* ================= 模組 5：紅筆捉錯 ＆ 選擇題消去雙擂台 ================= */
    .sub-mode-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .sub-mode-btn { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #cbd5e1; background: #f8fafc; font-weight: 900; font-size: calc(14.5px * var(--scale)); cursor: pointer; color: var(--muted); }
    .sub-mode-btn.active { background: #065f46; color: #fff; border-color: #065f46; }
    .paper-sheet { background: #fefce8; border: 2px solid #fde047; border-radius: 16px; padding: 18px; margin-bottom: 14px; }
    .sentence-chips-wrap { display: flex; flex-direction: column; gap: 10px; }
    .sentence-chip { padding: 14px 16px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff; font-size: calc(15px * var(--scale)); font-weight: 800; color: var(--text); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; line-height: 1.5; }
    .sentence-chip:hover { border-color: var(--rose); background: #fff1f2; }
    .sentence-chip.flaw-found { border-color: var(--rose); background: #ffe4e6; color: #9f1239; text-decoration: line-through; }
    .sentence-chip.good-clicked { border-color: var(--emerald); background: #dcfce7; color: #14532d; }

    .elim-stmt-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
    .elim-stmt-text { font-size: calc(15px * var(--scale)); font-weight: 800; flex: 1; }
    .elim-toggles { display: flex; gap: 6px; }
    .elim-btn { padding: 6px 12px; border-radius: 8px; border: 2px solid #cbd5e1; background: #fff; font-weight: 900; font-size: calc(13.5px * var(--scale)); cursor: pointer; }
    .elim-btn.t-true { background: var(--emerald); color: #fff; border-color: var(--emerald); }
    .elim-btn.t-false { background: var(--rose); color: #fff; border-color: var(--rose); }
    .mc-options-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
    @media (max-width: 600px) { .mc-options-row { grid-template-columns: 1fr; } }
    .mc-card-btn { padding: 14px 18px; border-radius: 12px; border: 2px solid #94a3b8; background: #fff; font-size: calc(16px * var(--scale)); font-weight: 900; text-align: left; cursor: pointer; }
    .mc-card-btn:hover { border-color: var(--emerald); background: #ecfdf5; }
    .mc-card-btn.eliminated { opacity: 0.3; text-decoration: line-through; background: #e2e8f0; border-color: #cbd5e1; }

    .feedback-pop { margin-top: 14px; padding: 16px 18px; border-radius: 14px; font-size: calc(15px * var(--scale)); font-weight: 700; display: none; line-height: 1.6; }
    .fb-ok { background: #dcfce7; border: 2px solid var(--emerald); color: #14532d; }
    .fb-err { background: #ffe4e6; border: 2px solid var(--rose); color: #881337; }

    .footer-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 12px; border-top: 2px solid #e2e8f0; }
    .nav-btn { padding: 10px 20px; border-radius: 10px; border: 2px solid #cbd5e1; background: #fff; font-weight: 900; font-size: calc(14.5px * var(--scale)); cursor: pointer; color: #065f46; }
    .nav-btn:hover { background: #ecfdf5; border-color: var(--emerald); }
    .primary-action { background: var(--emerald); color: #fff; border-color: var(--emerald); }
    .primary-action:hover { background: #047857; }
  </style>
</head>
<body>
<div class="app">
  <!-- 頂部狀態列 -->
  <div class="top-bar">
    <div class="brand-title">⚖️ 基礎會計第 7 課：會計假設、原則及慣例｜數碼會計工作台</div>
    <div class="stat-group">
      <div class="pill-stat" id="comboBadge">🔥 連擊：0</div>
      <div class="pill-stat" id="scoreBadge">⭐ 專業積分：0</div>
      <button class="ctrl-btn" onclick="reshuffleAll()" title="重新隨機打亂所有題目與選項次序">🔀 隨機洗牌</button>
      <button class="ctrl-btn" onclick="toggleZoom()" id="zoomBtn">🔍 投影大字體：關</button>
    </div>
  </div>

  <!-- 五大專屬會計學習模組導航 -->
  <div class="mode-nav">
    <button class="mode-tab active" onclick="switchMode(0)" id="mTab0">
      <span class="mode-icon">⚖️</span>
      <span class="mode-label">合規裁判診斷台</span>
      <span class="mode-sub">無提示辨識與專業裁決</span>
    </button>
    <button class="mode-tab" onclick="switchMode(1)" id="mTab1">
      <span class="mode-icon">🏷️</span>
      <span class="mode-label">資產計價計算器</span>
      <span class="mode-sub">三步純數值計價挑戰</span>
    </button>
    <button class="mode-tab" onclick="switchMode(2)" id="mTab2">
      <span class="mode-icon">⏱️</span>
      <span class="mode-label">應計跨期計算機</span>
      <span class="mode-sub">跨期損益三步純數值</span>
    </button>
    <button class="mode-tab" onclick="switchMode(3)" id="mTab3">
      <span class="mode-icon">🧲</span>
      <span class="mode-label">情境三步砌答案</span>
      <span class="mode-sub">對稱選項拼出滿分論述</span>
    </button>
    <button class="mode-tab" onclick="switchMode(4)" id="mTab4">
      <span class="mode-icon">🏆</span>
      <span class="mode-label">捉錯與消去擂台</span>
      <span class="mode-sub">紅筆批改 ＋ 選擇題消去</span>
    </button>
  </div>

  <!-- 主舞台 -->
  <div class="stage" id="mainStage"></div>
</div>

<script>
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ==================== 模組 1：會計原則「合規裁判官」診斷台（移除概念小字提示與裁決內的自爆字眼） ====================
  const fivePillars = [
    { key: "entity", name: "🏢 企業個體概念" },
    { key: "cost", name: "🏷️ 歷史成本原則" },
    { key: "going", name: "🚀 繼續經營概念" },
    { key: "consist", name: "📏 一貫原則" },
    { key: "accrual", name: "⏱️ 應計概念" }
  ];

  let judgeCases = [
    {
      speaker: "爭議個案 A：鐘錶店東主陳祖銘（課本第 87 頁「精確時計(7)」及第 93 頁題 7.25）",
      speech: "「我全資擁有這家企業！我從企業銀行帳戶提取 $6,000 買禮物給太太，又在年底取去一些原本給予顧客的免費樣本自用，金額不大，為甚麼不直接列作企業的『雜費』或『促銷費用』，而要扣減我的資本？」",
      conceptAns: "entity",
      rulings: [
        { text: "企業與其東主在會計上屬於兩個獨立個體；東主提取企業資金或免費樣本供私人自用均屬私人交易，必須視作「提用」並從資本中扣除，不可列作企業費用。", ok: true },
        { text: "由於商號平時一直將免費樣本開支記作促銷費用，為確保前後會計期間的處理方法保持一致，東主取去自用的免費樣本亦應一併列作促銷費用。", ok: false },
        { text: "只要東主提取自用的現金禮物與免費樣本金額佔總營業額比例極小，便可按實際購買成本直接列作企業本年度的雜費開支處理。", ok: false }
      ],
      exp: "【課本第 75、87、92 頁題 7.23a 及第 93 頁公開試題 7.25】根據**企業個體概念**，企業應被視作一個獨立於其東主的個體。東主提取企業資金買禮物給太太或取去免費樣本自用，均與企業業務無關，必須記錄為**「提用（Drawings）」**並扣減資本，絕不可因「平時記作促銷費用」而誤選一貫原則！"
    },
    {
      speaker: "爭議個案 B：獨資東主林先生（課本第 92 頁短答題 7.18 經典陷阱題）",
      speech: "「林先生是獨資經營者。去年，他把妻子名下的一個私人住宅物業記入企業的財務狀況表內；但在本年度，他決定不再把該項妻子物業記入企業的財務狀況表內。有人指責他今年更改做法是違反了會計原則。」",
      conceptAns: "entity",
      rulings: [
        { text: "林先生在本年度的做法並沒有違反會計原則（反而是糾正了去年的錯誤）；因為妻子的私人物業與企業無關，在去年記入企業帳目時違反了將企業與東主私人事務分開的原則。", ok: true },
        { text: "林先生在本年度的做法違反了會計原則；因為企業去年既已將該物業納入財務狀況表，今年便必須持續沿用相同處理方法繼續將該物業列入報表。", ok: false },

  function prepareDynamicMC(mcItem) {
    const shuffled = shuffle(mcItem.rawStmts);
    mcItem.stmts = shuffled.map((s, idx) => ({
      id: idx + 1,
      text: `(${idx + 1}) ${s.text}`,
      isTrue: s.isTrue,
      exp: s.exp
    }));
    const trueIds = mcItem.stmts.filter(s => s.isTrue).map(s => s.id);
    const correctCombo = allComboDefs.find(c =>
      c.reqTrue.length === trueIds.length && c.reqTrue.every(id => trueIds.includes(id))
    );
    const wrongPool = shuffle(allComboDefs.filter(c => c !== correctCombo)).slice(0, 3);
    const chosenCombos = [correctCombo, ...wrongPool].sort((a, b) => a.order - b.order);
    const letters = ["A", "B", "C", "D"];
    mcItem.options = chosenCombos.map((c, idx) => ({
      label: `${letters[idx]}. ${c.text}`,
      reqTrue: c.reqTrue,
      reqFalse: c.reqFalse
    }));
    mcItem.ansIdx = chosenCombos.indexOf(correctCombo);
  }

    document.getElementById("comboBadge").innerText = `🔥 連擊：${combo}`;
    document.getElementById("scoreBadge").innerText = `⭐ 專業積分：${score}`;
  }

  function switchMode(m) {
    curMode = m;
    for (let i = 0; i < 5; i++) {
      document.getElementById(`mTab${i}`).className = "mode-tab" + (i === m ? " active" : "");
    }
    judgePick = { concept: null, ruling: null };
    cStepPicks = [null, null, null];
    legoPicked = [null, null, null];
    elimState = { 1: null, 2: null, 3: null };
    renderStage();
  }

  function goSub(idx) {
    subIdx[curMode] = idx;
    judgePick = { concept: null, ruling: null };
    cStepPicks = [null, null, null];
    legoPicked = [null, null, null];
    elimState = { 1: null, 2: null, 3: null };
    renderStage();
  }

  function nextOrSwitch(maxLen, nextModeIdx) {
    if (subIdx[curMode] < maxLen - 1) goSub(subIdx[curMode] + 1);
    else switchMode(nextModeIdx);
  }

  function moveSub(delta, maxLen) {
    let next = subIdx[curMode] + delta;
    if (next >= 0 && next < maxLen) goSub(next);
  }

  function buildDots(total, customKeyPrefix) {
    const prefix = customKeyPrefix || `${curMode}`;
    let html = "";
    for (let i = 0; i < total; i++) {
      const k = `${prefix}_${i}`;
      const cls = (i === subIdx[curMode]) ? "dot-btn active" : (doneMap[k] ? "dot-btn done" : "dot-btn");
      html += `<button class="${cls}" onclick="goSub(${i})">${i + 1}</button>`;
    }
    return html;
  }

  function renderStage() {
    const stage = document.getElementById("mainStage");
    stage.classList.remove("pop");
    void stage.offsetWidth;
    stage.classList.add("pop");
    if (curMode === 0) renderJudgeMode(stage);
    else if (curMode === 1) renderValuationMode(stage);
    else if (curMode === 2) renderTimelineMode(stage);
    else if (curMode === 3) renderLegoMode(stage);
    else if (curMode === 4) renderArenaMode(stage);
  }

  // ==================== 渲染模組 1：會計原則「合規裁判官」診斷台 ====================
  function renderJudgeMode(stage) {
    const idx = subIdx[0];
    const item = judgeCases[idx];

    const pillarsHtml = fivePillars.map(p => `
      <div class="pillar-chip ${judgePick.concept === p.key ? 'picked' : ''}" onclick="setJudgePick('concept','${p.key}')">
        ${p.name}
      </div>
    `).join("");

    const rulingsHtml = item.rulings.map((r, rIdx) => `
      <button class="ruling-btn ${judgePick.ruling === rIdx ? 'picked' : ''}" onclick="setJudgePick('ruling', ${rIdx})">
        👨‍⚖️ ${r.text}
      </button>
    `).join("");

    stage.innerHTML = `
      <div>
        <div class="level-header">
          <span class="level-title">⚖️ 會計原則「合規裁判官」診斷台（無提示辨識與對稱裁決）</span>
          <div class="dots-nav">${buildDots(judgeCases.length)}</div>
        </div>

        <div class="dispute-box">
          <span class="dispute-speaker">🗣️ ${item.speaker}</span>
          <div class="dispute-speech">${item.speech}</div>
        </div>

        <div class="step-label">第一步：點選此個案所涉及（或違反）的「會計假設、原則或概念」：</div>
        <div class="pillars-strip">${pillarsHtml}</div>

        <div class="step-label">第二步：點選你作為總會計師的「專業合規裁決」（選項已隨機排列）：</div>
        <div class="ruling-grid">${rulingsHtml}</div>

        <div class="feedback-pop" id="jdgFb"></div>
      </div>
      <div class="footer-nav">
        <button class="nav-btn" onclick="moveSub(-1, ${judgeCases.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一爭議</button>
        <button class="nav-btn primary-action" onclick="nextOrSwitch(${judgeCases.length}, 1)">
          ${idx === judgeCases.length - 1 ? '進入「資產計價計算器」 →' : '下一爭議 →'}
        </button>
      </div>
    `;

    if (judgePick.concept !== null && judgePick.ruling !== null) {
      const fb = document.getElementById("jdgFb");
      fb.style.display = "block";
      const cOk = (judgePick.concept === item.conceptAns);
      const rOk = item.rulings[judgePick.ruling].ok;
      if (cOk && rOk) {
        addScore(20, `0_${idx}`);
        fb.className = "feedback-pop fb-ok";
        fb.innerHTML = `🎯 <strong>合規裁決完全正確！（+20 分）</strong><br>${item.exp}`;
      } else {
        breakCombo();
        const ansName = fivePillars.find(p => p.key === item.conceptAns).name;
        fb.className = "feedback-pop fb-err";
        fb.innerHTML = `⚠️ <strong>裁決有誤！</strong><br>• 第一步（識別原則）：${cOk ? '✓ 正確' : '✗ 應為「' + ansName + '」'}<br>• 第二步（專業裁決）：${rOk ? '✓ 正確' : '✗ 請再細閱課本對該原則的規定！'}<br>${item.exp}`;
      }
    }
  }

  function setJudgePick(key, val) {
    judgePick[key] = val;
    renderJudgeMode(document.getElementById("mainStage"));
  }

  // ==================== 渲染模組 2：資產計價三步純數值計算器 ====================
  function renderValuationMode(stage) {
    const idx = subIdx[1];
    const item = valuationCases[idx];

    const buildStepBox = (qTitle, optsArr, sIdx) => {
      const btns = optsArr.map((o, oIdx) =>
        `<button class="calc-opt-btn ${cStepPicks[sIdx] === oIdx ? 'picked' : ''}" onclick="pickValStep(${sIdx}, ${oIdx})">${o.text}</button>`
      ).join("");
      return `
        <div class="calc-step-box">
          <div class="calc-step-q">${qTitle}</div>
          ${btns}
        </div>
      `;
    };

    stage.innerHTML = `
      <div>
        <div class="level-header">
          <span class="level-title">🏷️ ${item.title}</span>
          <div class="dots-nav">
            <button class="helper-btn" onclick="autoSolveVal()">💡 示範三步滿分計算</button>
            ${buildDots(valuationCases.length)}
          </div>
        </div>

        <div class="invoice-card">
          <div class="inv-title">${item.cardTitle}</div>
          <div class="inv-body">${item.cardHtml}</div>
        </div>

        <div class="calc-steps-grid">
          ${buildStepBox(item.q1, item.opts1, 0)}
          ${buildStepBox(item.q2, item.opts2, 1)}
          ${buildStepBox(item.q3, item.opts3, 2)}
        </div>

        <div class="feedback-pop" id="valFb"></div>
      </div>
      <div class="footer-nav">
        <button class="nav-btn" onclick="moveSub(-1, ${valuationCases.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一檔案</button>
        <button class="nav-btn primary-action" onclick="nextOrSwitch(${valuationCases.length}, 2)">
          ${idx === valuationCases.length - 1 ? '進入「應計跨期計算機」 →' : '下一檔案 →'}
        </button>
      </div>
    `;

    if (cStepPicks[0] !== null && cStepPicks[1] !== null && cStepPicks[2] !== null) {
      const fb = document.getElementById("valFb");
      fb.style.display = "block";
      const ok0 = item.opts1[cStepPicks[0]].ok;
      const ok1 = item.opts2[cStepPicks[1]].ok;
      const ok2 = item.opts3[cStepPicks[2]].ok;
      if (ok0 && ok1 && ok2) {
        addScore(25, `1_${idx}`);
        fb.className = "feedback-pop fb-ok";
        fb.innerHTML = `🏆 <strong>三步資產計價全數命中！（+25 分）</strong><br>${item.exp}`;
      } else {
        breakCombo();
        fb.className = "feedback-pop fb-err";
        fb.innerHTML = `⚠️ <strong>部分步驟計價有誤：</strong> 第 1 步 [${ok0 ? '✓' : '✗'}] ｜ 第 2 步 [${ok1 ? '✓' : '✗'}] ｜ 第 3 步 [${ok2 ? '✓' : '✗'}]<br>${item.exp}`;
      }
    }
  }

  function pickValStep(sIdx, oIdx) {
    cStepPicks[sIdx] = oIdx;
    renderValuationMode(document.getElementById("mainStage"));
  }

  function autoSolveVal() {
    const item = valuationCases[subIdx[1]];
    cStepPicks[0] = item.opts1.findIndex(o => o.ok);
    cStepPicks[1] = item.opts2.findIndex(o => o.ok);
    cStepPicks[2] = item.opts3.findIndex(o => o.ok);
    renderValuationMode(document.getElementById("mainStage"));
  }

  // ==================== 渲染模組 3：應計跨期損益三步純數值計算機 ====================
  function renderTimelineMode(stage) {
    const idx = subIdx[2];
    const item = timelineCases[idx];

    const buildStepBox = (qTitle, optsArr, sIdx) => {
      const btns = optsArr.map((o, oIdx) =>
        `<button class="calc-opt-btn ${cStepPicks[sIdx] === oIdx ? 'picked' : ''}" onclick="pickTlStep(${sIdx}, ${oIdx})">${o.text}</button>`
      ).join("");
      return `
        <div class="calc-step-box">
          <div class="calc-step-q">${qTitle}</div>
          ${btns}
        </div>
      `;
    };

    stage.innerHTML = `
      <div>
        <div class="level-header">
          <span class="level-title">⏱️ ${item.title}</span>
          <div class="dots-nav">
            <button class="helper-btn" onclick="autoSolveTl()">💡 示範三步滿分計算</button>
            ${buildDots(timelineCases.length)}
          </div>
        </div>

        <div class="invoice-card">
          <div class="inv-title">${item.cardTitle}</div>
          <div class="inv-body">${item.cardHtml}</div>
        </div>

        <div class="calc-steps-grid">
          ${buildStepBox(item.q1, item.opts1, 0)}
          ${buildStepBox(item.q2, item.opts2, 1)}
          ${buildStepBox(item.q3, item.opts3, 2)}
        </div>

        <div class="feedback-pop" id="tlFb"></div>
      </div>
      <div class="footer-nav">
        <button class="nav-btn" onclick="moveSub(-1, ${timelineCases.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一案例</button>
        <button class="nav-btn primary-action" onclick="nextOrSwitch(${timelineCases.length}, 3)">
          ${idx === timelineCases.length - 1 ? '進入「情境三步砌答案」 →' : '下一案例 →'}
        </button>
      </div>
    `;

    if (cStepPicks[0] !== null && cStepPicks[1] !== null && cStepPicks[2] !== null) {
      const fb = document.getElementById("tlFb");
      fb.style.display = "block";
      const ok0 = item.opts1[cStepPicks[0]].ok;
      const ok1 = item.opts2[cStepPicks[1]].ok;
      const ok2 = item.opts3[cStepPicks[2]].ok;
      if (ok0 && ok1 && ok2) {
        addScore(25, `2_${idx}`);
        fb.className = "feedback-pop fb-ok";
        fb.innerHTML = `🏆 <strong>三步應計損益計算全數正確！（+25 分）</strong><br>${item.exp}`;
      } else {
        breakCombo();
        fb.className = "feedback-pop fb-err";
        fb.innerHTML = `⚠️ <strong>部分步驟有誤：</strong> 第 1 步 [${ok0 ? '✓' : '✗'}] ｜ 第 2 步 [${ok1 ? '✓' : '✗'}] ｜ 第 3 步 [${ok2 ? '✓' : '✗'}]<br>${item.exp}`;
      }
    }
  }

  function pickTlStep(sIdx, oIdx) {
    cStepPicks[sIdx] = oIdx;
    renderTimelineMode(document.getElementById("mainStage"));
  }

  function autoSolveTl() {
    const item = timelineCases[subIdx[2]];
    cStepPicks[0] = item.opts1.findIndex(o => o.ok);
    cStepPicks[1] = item.opts2.findIndex(o => o.ok);
    cStepPicks[2] = item.opts3.findIndex(o => o.ok);
    renderTimelineMode(document.getElementById("mainStage"));
  }

  // ==================== 渲染模組 4：磁力積木砌答案 ====================
  function renderLegoMode(stage) {
    const idx = subIdx[3];
    const item = legoChallenges[idx];
    let trayHtml = "";
    if (legoPicked[0] === null && legoPicked[1] === null && legoPicked[2] === null) {
      trayHtml = `<span class="tray-placeholder">👇 三步積木的字數與語氣均已對稱設計並隨機洗牌！請按課本第 85 頁三步策略依序點擊：「🟦 1.識別概念」＋「🟨 2.套用定義」＋「🟩 3.會計處理」</span>`;
    } else {
      const colors = ["chip-step0", "chip-step1", "chip-step2"];
      const stepLabels = ["🟦 步驟1", "🟨 步驟2", "🟩 步驟3"];
      legoPicked.forEach((pk, sIdx) => {
        if (pk !== null) {
          const obj = item[`step${sIdx}`][pk];
          trayHtml += `<span class="slot-chip ${colors[sIdx]}" onclick="removeLego(${sIdx})">${stepLabels[sIdx]}：${obj.text} ✖</span>`;
        }
      });
    }

    const buildPool = (stepArr, sIdx, tagLabel, tagBg, tagColor) => {
      return stepArr.map((blk, bIdx) => {
        const isSel = (legoPicked[sIdx] === bIdx);
        return `
          <button class="mag-block ${isSel ? 'selected' : ''}" onclick="pickLego(${sIdx}, ${bIdx})">
            <span class="block-tag" style="background:${tagBg}; color:${tagColor};">${tagLabel} ${isSel ? '✓ 已選' : ''}</span>
            <div>${blk.text}</div>
          </button>
        `;
      }).join("");
    };

    stage.innerHTML = `
      <div>
        <div class="level-header">
          <span class="level-title">🧲 ${item.title}</span>
          <div class="dots-nav">
            <button class="helper-btn" onclick="autoFillCorrectLego()">💡 示範滿分拼法</button>
            ${buildDots(legoChallenges.length)}
          </div>
        </div>
        <div class="question-strip">${item.q}</div>
        <div class="tray-header">
          <span style="font-size:calc(13.5px * var(--scale)); font-weight:900;">📥 你的磁力答題槽（揀齊 3 塊積木即自動批改）：</span>
          <button class="helper-btn" onclick="resetAndShuffleLego()">🔄 清空並重新隨機排列積木</button>
        </div>
        <div class="tray-box">${trayHtml}</div>
        <div class="blocks-section-title">1️⃣ 策略第 1 步：識別須應用的會計原則或概念［佔 1 分］</div>
        <div class="blocks-pool">${buildPool(item.step0, 0, "🟦 步驟 1：識別概念", "#dbeafe", "#1e3a8a")}</div>
        <div class="blocks-section-title">2️⃣ 策略第 2 步：將該會計概念應用到情境中（寫出定義的重要字眼）［佔 1 分］</div>
        <div class="blocks-pool">${buildPool(item.step1, 1, "🟨 步驟 2：定義與應用", "#fef3c7", "#92400e")}</div>
        <div class="blocks-section-title">3️⃣ 策略第 3 步：列出具體會計處理方法或入帳金額［佔 1 分］</div>
        <div class="blocks-pool">${buildPool(item.step2, 2, "🟩 步驟 3：處理與金額", "#d1fae5", "#065f46")}</div>
        <div class="feedback-pop" id="legoFb"></div>
      </div>
      <div class="footer-nav">
        <button class="nav-btn" onclick="moveSub(-1, ${legoChallenges.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一題</button>
        <button class="nav-btn primary-action" onclick="nextOrSwitch(${legoChallenges.length}, 4)">
          ${idx === legoChallenges.length - 1 ? '進入「捉錯與消去擂台」 →' : '下一題 →'}
        </button>
      </div>
    `;

    if (legoPicked[0] !== null && legoPicked[1] !== null && legoPicked[2] !== null) evaluateLego();
  }

  function pickLego(sIdx, bIdx) { legoPicked[sIdx] = bIdx; renderLegoMode(document.getElementById("mainStage")); }
  function removeLego(sIdx) { legoPicked[sIdx] = null; renderLegoMode(document.getElementById("mainStage")); }
  function resetAndShuffleLego() {
    const ch = legoChallenges[subIdx[3]];
    ch.step0 = shuffle(ch.step0);
    ch.step1 = shuffle(ch.step1);
    ch.step2 = shuffle(ch.step2);
    legoPicked = [null, null, null];
    renderLegoMode(document.getElementById("mainStage"));
  }
  function autoFillCorrectLego() {
    const item = legoChallenges[subIdx[3]];
    legoPicked[0] = item.step0.findIndex(b => b.ok);
    legoPicked[1] = item.step1.findIndex(b => b.ok);
    legoPicked[2] = item.step2.findIndex(b => b.ok);
    renderLegoMode(document.getElementById("mainStage"));
  }

  function evaluateLego() {
    const idx = subIdx[3];
    const item = legoChallenges[idx];
    const b0 = item.step0[legoPicked[0]], b1 = item.step1[legoPicked[1]], b2 = item.step2[legoPicked[2]];
    const fb = document.getElementById("legoFb");
    fb.style.display = "block";
    if (b0.ok && b1.ok && b2.ok) {
      addScore(25, `3_${idx}`);
      fb.className = "feedback-pop fb-ok";
      fb.innerHTML = `🏆 <strong>三步答題策略拼合完美！穩奪滿分！（+25 分）</strong><br>✨ <strong>合成標準答案</strong>：「<strong>${b0.text}</strong>。<strong>${b1.text}</strong>。<strong>${b2.text}</strong>」`;
    } else {
      breakCombo();
      let errs = [];
      if (!b0.ok) errs.push(`• 🟦 <strong>步驟 1 積木有誤</strong>：${b0.err}`);
      if (!b1.ok) errs.push(`• 🟨 <strong>步驟 2 積木有誤</strong>：${b1.err}`);
      if (!b2.ok) errs.push(`• 🟩 <strong>步驟 3 積木有誤</strong>：${b2.err}`);
      fb.className = "feedback-pop fb-err";
      fb.innerHTML = `⚠️ <strong>積木組合存在失分陷阱（請直接點擊下方正確積木替換）：</strong><br>${errs.join("<br>")}`;
    }
  }

  // ==================== 渲染模組 5：紅筆捉錯 ＆ 選擇題消去雙擂台 ====================
  function switchMod5Sub(s) {
    mod5Sub = s;
    subIdx[4] = 0;
    elimState = { 1: null, 2: null, 3: null };
    renderArenaMode(document.getElementById("mainStage"));
  }

  function renderArenaMode(stage) {
    const idx = subIdx[4];
    const topSwitch = `
      <div class="sub-mode-bar">
        <button class="sub-mode-btn ${mod5Sub === 0 ? 'active' : ''}" onclick="switchMod5Sub(0)">🖍️ 挑戰 A：紅筆捉錯（點擊答卷錯句）</button>
        <button class="sub-mode-btn ${mod5Sub === 1 ? 'active' : ''}" onclick="switchMod5Sub(1)">🏆 挑戰 B：組合選擇題消去法神器</button>
      </div>
    `;

    if (mod5Sub === 0) {
      const item = redPenCases[idx];
      const nums = ["①", "②", "③"];
      const chipsHtml = item.chips.map((ch, cIdx) => `
        <div class="sentence-chip" id="rpChip_${cIdx}" onclick="checkRedPen(${cIdx})">
          <span>${nums[cIdx]} ${ch.text}</span>
          <span style="font-size:calc(13px * var(--scale)); color:var(--rose); font-weight:900; white-space:nowrap;">🖍️ 點此捉錯</span>
        </div>
      `).join("");

      stage.innerHTML = `
        <div>
          ${topSwitch}
          <div class="level-header">
            <span class="level-title">🖍️ ${item.title}</span>
            <div class="dots-nav">${buildDots(redPenCases.length, "4_rp")}</div>
          </div>
          <div class="question-strip">${item.q}</div>
          <div class="paper-sheet">
            <div style="font-weight:900; color:var(--rose); margin-bottom:10px; font-size:calc(14px * var(--scale));">
              🖍️ 句子次序已隨機洗牌，請點擊藏有嚴重會計原則概念錯誤的那一句：
            </div>
            <div class="sentence-chips-wrap">${chipsHtml}</div>
          </div>
          <div class="feedback-pop" id="rpFb"></div>
        </div>
        <div class="footer-nav">
          <button class="nav-btn" onclick="moveSub(-1, ${redPenCases.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一題</button>
          <button class="nav-btn primary-action" onclick="${idx === redPenCases.length - 1 ? 'switchMod5Sub(1)' : `moveSub(1, ${redPenCases.length})`}">
            ${idx === redPenCases.length - 1 ? '進入「挑戰 B：選擇題消去法」 →' : '下一題 →'}
          </button>
        </div>
      `;
    } else {
      const item = elimMCs[idx];
      const stmtsHtml = item.stmts.map(st => {
        const curVal = elimState[st.id];
        return `
          <div class="elim-stmt-row">
            <div class="elim-stmt-text">${st.text}</div>
            <div class="elim-toggles">
              <button class="elim-btn ${curVal === true ? 't-true' : ''}" onclick="toggleElim(${st.id}, true)">⭕ 正確</button>
              <button class="elim-btn ${curVal === false ? 't-false' : ''}" onclick="toggleElim(${st.id}, false)">❌ 錯誤</button>
            </div>
          </div>
        `;
      }).join("");

      const optsHtml = item.options.map((opt, oIdx) => {
        let isElim = false;
        [1, 2, 3].forEach(sId => {
          if (elimState[sId] === true && opt.reqFalse.includes(sId)) isElim = true;
          if (elimState[sId] === false && opt.reqTrue.includes(sId)) isElim = true;
        });
        return `<button class="mc-card-btn ${isElim ? 'eliminated' : ''}" onclick="checkElimMc(${oIdx})">${opt.label}</button>`;
      }).join("");

      stage.innerHTML = `
        <div>
          ${topSwitch}
          <div class="level-header">
            <span class="level-title">🏆 ${item.title}</span>
            <div class="dots-nav">${buildDots(elimMCs.length, "4_mc")}</div>
          </div>
          <div class="question-strip">${item.stem}</div>
          <p style="font-size:calc(14px * var(--scale)); font-weight:800; color:var(--teal); margin-bottom:8px;">
            💡 消去法神器：本題可能只有 1 項、2 項或全部 3 項正確！請先在右方標記「⭕ 正確」或「❌ 錯誤」自動劃走錯項！
          </p>
          <div>${stmtsHtml}</div>
          <div class="mc-options-row">${optsHtml}</div>
          <div class="feedback-pop" id="elimFb"></div>
        </div>
        <div class="footer-nav">
          <button class="nav-btn" onclick="moveSub(-1, ${elimMCs.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一題</button>
          <button class="nav-btn primary-action" onclick="moveSub(1, ${elimMCs.length})" ${idx === elimMCs.length - 1 ? 'style="visibility:hidden"' : ''}>下一題 →</button>
        </div>
      `;
    }
  }

  function checkRedPen(cIdx) {
    const idx = subIdx[4];
    const item = redPenCases[idx];
    const ch = item.chips[cIdx];
    const nums = ["①", "②", "③"];
    const el = document.getElementById(`rpChip_${cIdx}`);
    const fb = document.getElementById("rpFb");
    fb.style.display = "block";
    if (ch.isFlaw) {
      el.className = "sentence-chip flaw-found";
      addScore(20, `4_rp_${idx}`);
      fb.className = "feedback-pop fb-ok";
      fb.innerHTML = `<strong>🖍️ 紅筆精準捉錯（第 ${nums[cIdx]} 句得 0 分）！</strong><br>${item.exp}`;
    } else {
      el.className = "sentence-chip good-clicked";
      breakCombo();
      fb.className = "feedback-pop fb-err";
      fb.innerHTML = `⭕ <strong>第 ${nums[cIdx]} 句是完全正確的課本陳述！</strong> 請再檢查其餘句子找出真正的概念陷阱！`;
    }
  }

  function toggleElim(sId, val) {
    elimState[sId] = (elimState[sId] === val) ? null : val;
    renderArenaMode(document.getElementById("mainStage"));
  }

  function checkElimMc(oIdx) {
    const idx = subIdx[4];
    const item = elimMCs[idx];
    const fb = document.getElementById("elimFb");
    fb.style.display = "block";
    if (oIdx === item.ansIdx) {
      addScore(20, `4_mc_${idx}`);
      const breakdown = item.stmts.map(s => `• <strong>陳述 (${s.id}) ${s.isTrue ? '⭕ 正確' : '❌ 錯誤'}</strong>：${s.exp}`).join("<br>");
      fb.className = "feedback-pop fb-ok";
      fb.innerHTML = `<strong>🏆 答對了！標準答案：${item.options[item.ansIdx].label}</strong><br>${breakdown}`;
    } else {
      breakCombo();
      fb.className = "feedback-pop fb-err";
      fb.innerHTML = "❌ <strong>選項不正確！</strong> 試試先在上方逐句判斷 (1)、(2)、(3) 的對錯，利用消去法鎖定答案！";
    }
  }

  randomizeAllData();
  renderStage();
</script>
</body>
</html>
